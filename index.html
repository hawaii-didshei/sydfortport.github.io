<div id="screen-create" class="screen hidden">
  <h1>Создать суд</h1>
  <label>Режим</label>
  <select id="create-mode">
    <option value="with_victim">С жертвой</option>
    <option value="only_defendant">Только подсудимый</option>
  </select>
  <button onclick="createRoom()">Создать</button>
  <p id="create-error"></p>
</div>

<div id="screen-join" class="screen hidden">
  <h1 id="join-title">Вход в суд</h1>
  <label>Код комнаты</label>
  <input id="join-code" type="text" />
  <label>Ник(желательно тот же что и на фортпорт что бы не путались)</label>
  <input id="join-nick" type="text" />
  <div id="join-role-field">
    <label>Роль</label>
    <select id="join-role">
      <option value="spectator">Зритель</option>
      <option value="witness">Свидетель</option>
      <option value="prosecutor">Прокурор</option>
      <option value="advocate">Адвокат</option>
      <option value="defendant">Подсудимый</option>
      <option value="victim">Жертва</option>
    </select>
  </div>
  <label>Аватарка</label>
  <input id="join-avatar" type="file" accept="image/*" />
  <button id="join-btn" onclick="joinRoom()">Войти</button>
  <p id="join-error"></p>
</div>
